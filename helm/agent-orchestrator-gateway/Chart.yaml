apiVersion: v2
name: agent-orchestrator-gateway
description: >
  Gateway service that fronts the Bedrock supervisor agent for end users --
  runs on EKS, authenticates to AWS via IRSA (no static credentials), and
  exposes a REST endpoint that invokes the supervisor agent alias.
