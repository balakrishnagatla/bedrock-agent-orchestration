name: Terraform GitOps Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write   # required for AWS OIDC (no static credentials, ever)
  pull-requests: write # PR plan comments

env:
  TF_VERSION: "1.9.5"
  TFLINT_VERSION: "v0.53.0"
  CHECKOV_VERSION: "3.2.257"

jobs:
  # ---------------------------------------------------------------------------
  # PR stage: fmt, lint, security scan, plan -- for every environment, on
  # every PR that touches terraform/. Nothing here can mutate AWS state; the
  # plan role is read-only.
  # ---------------------------------------------------------------------------
  validate:
    if: github.event_name == 'pull_request'
    name: validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          ROLE_ARN: ${{ matrix.environment == 'prod' && secrets.AWS_PLAN_ROLE_ARN_PROD || secrets.AWS_PLAN_ROLE_ARN_DEV }}
          STATE_BUCKET: ${{ matrix.environment == 'prod' && secrets.TF_STATE_BUCKET_PROD || secrets.TF_STATE_BUCKET_DEV }}
        run: |
          missing=()
          [[ -z "${ROLE_ARN}" ]] && missing+=("AWS_PLAN_ROLE_ARN_$(echo ${{ matrix.environment }} | tr '[:lower:]' '[:upper:]')")
          [[ -z "${STATE_BUCKET}" ]] && missing+=("TF_STATE_BUCKET_$(echo ${{ matrix.environment }} | tr '[:lower:]' '[:upper:]')")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Required repository secret(s) not set: ${missing[*]}. Configure these in Settings > Secrets and variables > Actions before this pipeline can run against AWS. See README.md#cicd-pipeline."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFLint
        working-directory: terraform/environments/${{ matrix.environment }}
        run: tflint --recursive --config "${{ github.workspace }}/.tflint.hcl"

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/environments/${{ matrix.environment }}
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov-${{ matrix.environment }}.sarif

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-${{ matrix.environment }}.sarif
          category: checkov-${{ matrix.environment }}

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/environments/${{ matrix.environment }}
          soft_fail: false

      - name: Configure AWS credentials (plan-only, read role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && secrets.AWS_PLAN_ROLE_ARN_PROD || secrets.AWS_PLAN_ROLE_ARN_DEV }}
          aws-region: us-east-1
          role-session-name: gha-terraform-plan-${{ matrix.environment }}

      - name: terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ matrix.environment == 'prod' && secrets.TF_STATE_BUCKET_PROD || secrets.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=bedrock-agent-orchestration/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-locks"

      - name: terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: terraform plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color -out=tfplan.binary \
            | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/environments/${{ matrix.environment }}/plan_output.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-60000) : 'No plan output produced.';
            const body = [
              `### Terraform Plan — \`${{ matrix.environment }}\``,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Main branch stage: apply. Gated by a GitHub Environment (manual approval
  # + required reviewers configured in repo Settings > Environments), scoped
  # OIDC role per environment, and a concurrency group so two applies against
  # the same environment/state can never race.
  # ---------------------------------------------------------------------------
  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev", "prod"]') }}
    environment:
      name: ${{ matrix.environment }}
    concurrency:
      group: terraform-apply-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          ROLE_ARN: ${{ matrix.environment == 'prod' && secrets.AWS_APPLY_ROLE_ARN_PROD || secrets.AWS_APPLY_ROLE_ARN_DEV }}
          STATE_BUCKET: ${{ matrix.environment == 'prod' && secrets.TF_STATE_BUCKET_PROD || secrets.TF_STATE_BUCKET_DEV }}
        run: |
          missing=()
          [[ -z "${ROLE_ARN}" ]] && missing+=("AWS_APPLY_ROLE_ARN_$(echo ${{ matrix.environment }} | tr '[:lower:]' '[:upper:]')")
          [[ -z "${STATE_BUCKET}" ]] && missing+=("TF_STATE_BUCKET_$(echo ${{ matrix.environment }} | tr '[:lower:]' '[:upper:]')")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Required repository secret(s) not set: ${missing[*]}. Configure these in Settings > Secrets and variables > Actions before this pipeline can apply against AWS. See README.md#cicd-pipeline."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (apply role, OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && secrets.AWS_APPLY_ROLE_ARN_PROD || secrets.AWS_APPLY_ROLE_ARN_DEV }}
          aws-region: us-east-1
          role-session-name: gha-terraform-apply-${{ matrix.environment }}

      - name: terraform init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ matrix.environment == 'prod' && secrets.TF_STATE_BUCKET_PROD || secrets.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=bedrock-agent-orchestration/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-state-locks"

      - name: terraform apply
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform apply -input=false -auto-approve

      - name: Summarize outputs
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          {
            echo "### Terraform Outputs — \`${{ matrix.environment }}\`"
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
